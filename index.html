:root{
  --bg:#edf1ee; --surface:#ffffff; --ink:#15201b; --muted:#5b6962; --faint:#8b978f; --line:#c6d0c9; --accent:#2c5b4b; --accent-soft:#e1ece6;
  --serif:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0d1311; --surface:#141c19; --ink:#e3eae6; --muted:#9caaa2; --faint:#6e7c75; --line:#33413b; --accent:#8fcbb0; --accent-soft:#1c2e27;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  display:grid;grid-template-rows:1fr auto;min-height:100vh;min-height:100dvh}
main{display:grid;place-items:center;padding:48px 20px}
.inner{width:min(640px,100%);text-align:center}
.eyebrow{font-size:12px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0 0 18px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(76px,20vw,168px);line-height:.9;letter-spacing:-.02em;margin:0}
h1 em{font-style:italic;color:var(--accent)}
.line{font-family:var(--serif);font-style:italic;font-size:clamp(20px,4.2vw,27px);color:var(--muted);margin:22px 0 0}

/* A little line with three stops and something travelling between them. */
.track{position:relative;width:min(340px,80%);height:14px;margin:44px auto 0}
.track::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;border-radius:2px;background:var(--line)}
.stop{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 2px var(--line)}
.stop:nth-child(1){left:0}.stop:nth-child(2){left:50%}.stop:nth-child(3){left:100%}
.car{position:absolute;top:50%;left:0;width:26px;height:8px;margin:-4px 0 0 -13px;border-radius:4px;background:var(--accent);animation:ride 9s cubic-bezier(.55,0,.45,1) infinite}
@keyframes ride{0%,12%{left:0}38%,62%{left:50%}88%,100%{left:100%}}
@media (prefers-reduced-motion: reduce){.car{animation:none;left:50%}}

footer{padding:22px 20px 28px;text-align:center;font-size:13px;color:var(--faint)}

<main>
  <div class="inner">
    <p class="eyebrow">telnes.de</p>
    <h1>teln<em>e</em>s</h1>
    <p class="line">Something is being built here.</p>
    <div class="track" aria-hidden="true"><span class="stop"></span><span class="stop"></span><span class="stop"></span><span class="car"></span></div>
  </div>
</main>
<footer>© 2026 telnes</footer>
</body>
